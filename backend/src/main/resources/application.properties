spring.application.name=shipmaster-backend
server.port=8080

# ---------- Database: H2 for now, PostgreSQL later ----------
# File database in backend/data/ (git-ignored), so players and progress survive restarts.
# MODE=PostgreSQL keeps SQL compatible with the future PostgreSQL switch.
spring.datasource.url=jdbc:h2:file:./data/shipmaster;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Schema is owned by Liquibase; Hibernate only checks that entities match it.
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# H2 web console: http://localhost:8080/h2-console (JDBC URL as above). Local development only.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- API ----------
# Errors as RFC 9457 problem+json.
spring.mvc.problemdetails.enabled=true
spring.jackson.time-zone=UTC

# ---------- Auth ----------
# Signing key for access JWTs (HS256): base64 of at least 32 random bytes, from the environment only.
# Generate: openssl rand -base64 32
shipmaster.auth.jwt-secret=${SHIPMASTER_JWT_SECRET:}
shipmaster.auth.issuer=shipmaster
shipmaster.auth.access-ttl=15m
shipmaster.auth.refresh-ttl=60d
# A refresh retried within this window (lost response) gets a new session instead of revoking the family.
shipmaster.auth.refresh-grace=30s
