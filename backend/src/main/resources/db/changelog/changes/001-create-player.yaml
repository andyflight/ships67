databaseChangeLog:
  - changeSet:
      id: 001-create-player
      author: shipmaster
      changes:
        - createTable:
            tableName: player
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_player, nullable: false } }
              - column: { name: tag, type: varchar(9), constraints: { nullable: false, unique: true, uniqueConstraintName: uq_player_tag } }
              - column: { name: display_name, type: varchar(16), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp with time zone, constraints: { nullable: false } }
              # Optimistic lock; later reused as the player's state version.
              - column: { name: version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
